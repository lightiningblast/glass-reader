<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' data: blob:">
<title>Glass Reader</title>
<style>
/* Desktop: the top strip drags the window; Windows' min/max/close buttons sit at the top right. */
html.desktop{--font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--font-display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
html.mica body{background:transparent}
html.mica .ambient{opacity:.45}
html.desktop #topbar{-webkit-app-region:drag;padding-top:0;height:44px;align-items:center;padding-right:150px;box-sizing:border-box}
html.desktop #topbar .bar{-webkit-app-region:no-drag;height:36px;padding:2px}
html.desktop #topbar .ib{width:32px;height:32px}
html.desktop .chip{height:28px}
html.desktop #searchPanel,html.desktop #viewMenu{top:52px}
html.desktop #sidebar{top:56px}
html.desktop #pages{padding-top:72px}
html.desktop #scrubber{top:64px}
html.desktop #focusExit{top:52px}
#updateBar{position:absolute;z-index:61;left:50%;top:56px;transform:translate(-50%,-12px) scale(.95);opacity:0;visibility:hidden;padding:4px 4px 4px 16px;gap:10px;font-size:13px;font-weight:500;
  transition:opacity .25s,transform .5s var(--spring),visibility 0s .25s}
#updateBar.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .25s,transform .5s var(--spring)}
</style>
<style>
/* Layout: one continuous column of pages fills the screen; liquid-glass chrome (top bar, sidebar, tool dock, scrubber) floats above it. */
:root{
  --bg:#e6e9f0; --amb-1:rgba(104,146,255,.30); --amb-2:rgba(255,138,190,.20); --amb-3:rgba(80,206,186,.18);
  --fg:#1c1c1e; --fg-2:#5b606d; --fg-3:#8b909b;
  --glass:rgba(250,251,255,.50); --glass-strong:rgba(250,251,255,.80);
  --rim:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.40); --edge:rgba(15,25,55,.10);
  --sheen:rgba(255,255,255,.60);
  --shadow:rgba(25,35,75,.20); --hover:rgba(15,25,55,.07); --press:rgba(15,25,55,.13);
  --accent:#0a7aff; --accent-soft:rgba(10,122,255,.15); --on-accent:#fff;
  --sep:rgba(15,25,55,.13); --danger:#e5342a;
  --page:#fff; --page-shadow:0 1px 2px rgba(20,30,60,.08),0 14px 40px -6px rgba(20,30,60,.16);
  --find:rgba(255,204,0,.45); --find-on:rgba(255,140,0,.75);
  --scrim:rgba(230,233,240,.35);
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --spring:cubic-bezier(.3,1.35,.5,1); --ease:cubic-bezier(.22,.8,.24,1);
  --side-w:212px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0e12; --amb-1:rgba(70,100,255,.22); --amb-2:rgba(200,80,160,.14); --amb-3:rgba(40,170,150,.12);
  --fg:#f5f5f7; --fg-2:#a3a7b1; --fg-3:#6f737d;
  --glass:rgba(38,40,48,.50); --glass-strong:rgba(40,42,52,.84);
  --rim:rgba(255,255,255,.26); --rim-2:rgba(255,255,255,.08); --edge:rgba(255,255,255,.07);
  --sheen:rgba(255,255,255,.10);
  --shadow:rgba(0,0,0,.55); --hover:rgba(255,255,255,.08); --press:rgba(255,255,255,.14);
  --accent:#3b95ff; --accent-soft:rgba(59,149,255,.24); --on-accent:#fff;
  --sep:rgba(255,255,255,.12); --danger:#ff5a50;
  --page-shadow:0 1px 2px rgba(0,0,0,.4),0 16px 44px -6px rgba(0,0,0,.6);
  --scrim:rgba(5,6,10,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d0e12; --amb-1:rgba(70,100,255,.22); --amb-2:rgba(200,80,160,.14); --amb-3:rgba(40,170,150,.12);
  --fg:#f5f5f7; --fg-2:#a3a7b1; --fg-3:#6f737d;
  --glass:rgba(38,40,48,.50); --glass-strong:rgba(40,42,52,.84);
  --rim:rgba(255,255,255,.26); --rim-2:rgba(255,255,255,.08); --edge:rgba(255,255,255,.07);
  --sheen:rgba(255,255,255,.10);
  --shadow:rgba(0,0,0,.55); --hover:rgba(255,255,255,.08); --press:rgba(255,255,255,.14);
  --accent:#3b95ff; --accent-soft:rgba(59,149,255,.24); --on-accent:#fff;
  --sep:rgba(255,255,255,.12); --danger:#ff5a50;
  --page-shadow:0 1px 2px rgba(0,0,0,.4),0 16px 44px -6px rgba(0,0,0,.6);
  --scrim:rgba(5,6,10,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;height:100%;overflow:hidden}
.ambient{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 50% at 12% 8%,var(--amb-1),transparent 70%),radial-gradient(50% 45% at 92% 30%,var(--amb-2),transparent 70%),radial-gradient(55% 50% at 60% 100%,var(--amb-3),transparent 70%)}

/* ---------- Viewer ---------- */
#viewer{position:absolute;inset:0;overflow:auto;scrollbar-width:none;overscroll-behavior:contain;outline:none}
#viewer::-webkit-scrollbar{display:none}
#pages{position:relative;display:flex;flex-direction:column;gap:28px;width:max-content;min-width:100%;box-sizing:border-box;
  padding-block:calc(88px + env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:padding-left .45s var(--ease)}
#app.side-open.wide #pages{padding-left:calc(var(--side-w) + 40px + env(safe-area-inset-left,0px))}
.page{position:relative;margin-inline:auto;background:var(--page);box-shadow:var(--page-shadow);border-radius:3px;flex:none;contain:layout style}
.page>canvas.pdf{position:absolute;inset:0;width:100%;height:100%;border-radius:3px;animation:pageIn .35s var(--ease)}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
.page .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-3);font-size:13px;font-variant-numeric:tabular-nums;pointer-events:none}
.page.ready .loading{display:none}
#pages.tint-sepia .page{background:#f6eedb}
#pages.tint-sepia canvas.pdf{filter:sepia(.32) saturate(1.1) brightness(.97)}
#pages.tint-night .page{background:#151619}
#pages.tint-night canvas.pdf{filter:invert(.9) hue-rotate(180deg) brightness(1.05)}
canvas.anno{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply;z-index:3}
#pages.tint-night canvas.anno{mix-blend-mode:normal;opacity:.85}
.notes{position:absolute;inset:0;pointer-events:none;z-index:4}
.note-pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;pointer-events:auto;display:grid;place-items:center;
  background:var(--c);color:#1c1c1e;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 .5px rgba(0,0,0,.15),0 6px 14px -4px rgba(0,0,0,.35);
  transition:transform .35s var(--spring)}
.note-pin:hover{transform:scale(1.12)}
.note-pin svg{width:16px;height:16px}

/* pdf.js text layer */
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2;caret-color:var(--accent)}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer .highlight{margin:-1px;padding:1px;background:var(--find);border-radius:4px}
.textLayer .highlight.selected{background:var(--find-on);box-shadow:0 0 0 2px var(--find-on)}
.textLayer ::selection{background:rgba(10,122,255,.28)}
.textLayer[data-main-rotation="90"]{transform:rotate(90deg) translateY(-100%)}
.textLayer[data-main-rotation="180"]{transform:rotate(180deg) translate(-100%,-100%)}
.textLayer[data-main-rotation="270"]{transform:rotate(270deg) translateX(-100%)}

/* tool modes */
#app.t-hand #viewer{cursor:grab}
#app.t-hand.panning #viewer{cursor:grabbing}
#app.t-hand .textLayer,#app.t-pen .textLayer,#app.t-eraser .textLayer,#app.t-note .textLayer{pointer-events:none;user-select:none;-webkit-user-select:none}
#app.t-pen .page,#app.t-eraser .page{touch-action:none}
#app.t-pen .page{cursor:crosshair}
#app.t-eraser .page{cursor:cell}
#app.t-note .page{cursor:copy}
#app.t-highlight .page{cursor:text}
#app.t-highlight .textLayer ::selection{background:color-mix(in srgb,var(--tool-color) 45%,transparent)}

/* ---------- Glass material ---------- */
.glass{position:relative;isolation:isolate;background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(1.9) brightness(1.03);backdrop-filter:blur(22px) saturate(1.9) brightness(1.03);
  box-shadow:inset 0 .5px 0 var(--rim),inset 0 -.5px 0 var(--rim-2),0 0 0 .5px var(--edge),0 12px 32px -10px var(--shadow),0 2px 8px -3px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(155deg,var(--rim) 0%,transparent 30%,transparent 68%,var(--rim-2) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(160px 90px at var(--mx,25%) var(--my,-30%),var(--sheen),transparent 72%);transition:opacity .4s}
.bar{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;height:46px;box-sizing:border-box}
.panel{border-radius:24px}
.ib{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;flex:none;color:var(--fg);
  transition:background .2s,transform .35s var(--spring),color .2s,opacity .25s}
.ib:hover{background:var(--hover)}
.ib:active{transform:scale(.88);background:var(--press)}
.ib:disabled{opacity:.32;pointer-events:none}
.ib.on{color:var(--accent)}
.ib:focus-visible,.txtbtn:focus-visible,.chip:focus-within,.seg button:focus-visible,.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sep{width:1px;height:22px;background:var(--sep);margin:0 4px;flex:none;transition:opacity .25s,margin .35s}
.txtbtn{height:38px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;transition:background .2s,transform .35s var(--spring)}
.txtbtn:hover{background:var(--hover)}
.txtbtn:active{transform:scale(.94)}
.txtbtn.primary{background:var(--accent);color:var(--on-accent)}
.txtbtn.danger{color:var(--danger)}

/* ---------- Top bar ---------- */
#topbar{position:absolute;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:transform .5s var(--ease),opacity .4s}
#topbar>*{pointer-events:auto}
#barLeft{min-width:0;flex:0 1 auto}
.doc-title{font:600 13.5px/1.2 var(--font-display);letter-spacing:-.01em;padding:0 8px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;min-width:0}
.chip{display:flex;align-items:center;gap:4px;height:34px;padding:0 12px 0 6px;border-radius:999px;background:var(--hover);font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;cursor:text}
.chip input{width:3.2ch;border:0;background:transparent;text-align:right;font-weight:600;color:var(--fg);outline:none;padding:0;font-variant-numeric:tabular-nums}
#zoomLabel{min-width:58px;font-variant-numeric:tabular-nums;padding:0 8px}
#app.focus #topbar{transform:translateY(-130%);opacity:0}

/* ---------- Sidebar ---------- */
#sidebar{position:absolute;z-index:15;width:var(--side-w);display:flex;flex-direction:column;overflow:hidden;
  top:calc(72px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));
  transform:translateX(calc(-100% - 40px)) scale(.96);opacity:0;transition:transform .55s var(--spring),opacity .3s;pointer-events:none}
#app.side-open #sidebar{transform:none;opacity:1;pointer-events:auto}
#app.focus #sidebar{transform:translateX(calc(-100% - 40px));opacity:0}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:10px 10px 6px;padding:3px;border-radius:999px;background:var(--hover);flex:none}
.seg button{position:relative;z-index:1;height:28px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--fg-2);transition:color .25s}
.seg button.on{color:var(--fg)}
.seg-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--glass-strong);
  box-shadow:0 1px 3px var(--shadow),inset 0 .5px 0 var(--rim);transition:transform .5s var(--spring)}
.seg[data-on="1"] .seg-ind{transform:translateX(100%)}
.side-scroll{flex:1;overflow:auto;padding:6px 14px 16px;scrollbar-width:thin;overscroll-behavior:contain}
#thumbs{display:flex;flex-direction:column;align-items:center;gap:14px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:6px 0;border-radius:14px;transition:background .2s}
.thumb:hover{background:var(--hover)}
.thumb .tf{position:relative;width:112px;max-width:100%;background:var(--page);border-radius:3px;box-shadow:0 0 0 .5px var(--edge),0 4px 12px -4px var(--shadow);overflow:hidden;transition:box-shadow .3s}
.thumb .tf canvas{position:absolute;inset:0;width:100%;height:100%;animation:pageIn .3s var(--ease)}
.thumb .tn{font-size:11.5px;color:var(--fg-2);font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:999px;transition:background .25s,color .25s}
.thumb.on .tf{box-shadow:0 0 0 2.5px var(--accent),0 6px 16px -4px var(--shadow)}
.thumb.on .tn{background:var(--accent);color:var(--on-accent)}
#outline ul{list-style:none;margin:0;padding:0}
#outline ul ul{padding-left:12px}
#outline button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:13px;line-height:1.3;color:var(--fg);text-wrap:balance}
#outline button:hover{background:var(--hover)}
.empty{padding:28px 8px;text-align:center;color:var(--fg-3);font-size:12.5px;line-height:1.5}

/* ---------- Dock ---------- */
#dock{position:absolute;z-index:20;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);height:50px;padding:5px;gap:0;
  transition:transform .5s var(--spring),opacity .35s}
#dock .ib{width:40px;height:40px;position:relative;z-index:1;overflow:hidden;transition:background .2s,transform .35s var(--spring),color .25s,width .45s var(--spring),opacity .3s}
#dock .ib.on{background:transparent;color:var(--accent)}
.dock-ind{position:absolute;top:5px;left:0;height:40px;width:40px;border-radius:999px;background:var(--accent-soft);box-shadow:inset 0 .5px 0 var(--rim-2);
  transition:transform .55s var(--spring),width .55s var(--spring);pointer-events:none}
.swatch{width:20px;height:20px;border-radius:50%;background:var(--tool-color);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),0 0 0 .5px rgba(0,0,0,.2)}
#dock.compact .tool:not(.on),#dock.compact .hc{width:0;opacity:0;pointer-events:none}
#dock.compact .sep.hc{margin:0;width:0}
#dock.compact{transform:translateX(-50%) scale(.94)}
#app.focus #dock{transform:translateX(-50%) translateY(160%);opacity:0}

/* ---------- Popovers ---------- */
.pop{position:absolute;z-index:30;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.96);transform-origin:var(--origin,top center);
  transition:opacity .2s,transform .45s var(--spring),visibility 0s .25s}
.pop.show{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .45s var(--spring),visibility 0s}
.pop.up{transform:translateY(6px) scale(.96)}
.pop.up.show{transform:none}
#searchPanel{top:calc(68px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100% - 32px));--origin:top right;padding-left:12px}
#searchPanel input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;padding:0 6px;height:36px}
#searchPanel input::placeholder{color:var(--fg-3)}
#searchCount{font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 4px}
#searchPanel>svg{color:var(--fg-2)}
#viewMenu{top:calc(68px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:276px;padding:14px;--origin:top right;display:flex;flex-direction:column;gap:14px}
.mrow{display:flex;flex-direction:column;gap:8px}
.mlabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding-left:4px}
.mline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mline .grow{flex:1}
.zoomval{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;text-align:center;flex:1}
.choice{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:3px;border-radius:999px;background:var(--hover)}
.choice button{height:30px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--fg-2);transition:background .25s,color .25s,box-shadow .25s}
.choice button.on{background:var(--glass-strong);color:var(--fg);box-shadow:0 1px 3px var(--shadow),inset 0 .5px 0 var(--rim)}
.pill-btn{flex:1;height:34px;border-radius:12px;background:var(--hover);font-size:12.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,transform .35s var(--spring)}
.pill-btn:hover{background:var(--press)}
.pill-btn:active{transform:scale(.95)}
.pill-btn svg{width:17px;height:17px}
#colorPop,#selPop{--origin:bottom center;padding:5px 8px}
.sw{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;transition:transform .35s var(--spring)}
.sw:hover{transform:scale(1.12)}
.sw i{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5),0 0 0 .5px rgba(0,0,0,.2);transition:box-shadow .2s}
.sw.on i{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6),0 0 0 2px var(--glass-strong),0 0 0 3.5px var(--c)}
.wd{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--fg-3)}
.wd i{display:block;border-radius:50%;background:currentColor}
.wd.on{color:var(--fg);background:var(--hover)}
#selPop .txtbtn{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px}
#selPop .txtbtn svg{width:16px;height:16px}
#notePop{width:260px;box-sizing:border-box;padding:12px;display:flex;flex-direction:column;gap:10px;--origin:top left}
#notePop textarea{resize:none;height:110px;border:0;border-radius:14px;background:var(--hover);padding:10px 12px;font-size:13.5px;line-height:1.45;outline:none}
#notePop textarea:focus{box-shadow:0 0 0 2px var(--accent-soft)}
#notePop .nrow{display:flex;align-items:center;justify-content:space-between;gap:6px}
#notePop .meta{font-size:11.5px;color:var(--fg-3);font-variant-numeric:tabular-nums}

/* ---------- Scrubber ---------- */
#scrubber{position:absolute;z-index:12;right:max(6px,env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:24px;
  opacity:0;transition:opacity .4s;touch-action:none}
#scrubber.active,#scrubber:hover,#scrubber.drag{opacity:1}
#scrubThumb{position:absolute;right:6px;top:0;width:6px;border-radius:999px;background:var(--fg-3);opacity:.75;transition:width .3s var(--spring),right .3s var(--spring),opacity .2s;cursor:grab}
#scrubber:hover #scrubThumb,#scrubber.drag #scrubThumb{width:10px;right:4px;opacity:1}
#scrubBubble{position:absolute;right:30px;top:0;white-space:nowrap;padding:0 14px;height:34px;display:flex;align-items:center;border-radius:999px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
  opacity:0;transform:translateX(8px) scale(.94);transition:opacity .25s,transform .45s var(--spring);pointer-events:none}
#scrubBubble span{color:var(--fg-2);font-weight:500;margin-left:4px}
#scrubber.active #scrubBubble,#scrubber.drag #scrubBubble{opacity:1;transform:none}

/* ---------- Overlays ---------- */
.scrim{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.scrim.show{opacity:1;visibility:visible;transition:opacity .25s}
.scrim .card{padding:26px;width:min(360px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:14px;transform:scale(.94);transition:transform .5s var(--spring)}
.scrim.show .card{transform:none}
.card h2{margin:0;font:600 19px/1.25 var(--font-display);letter-spacing:-.015em;text-wrap:balance}
.card p{margin:0;font-size:13.5px;line-height:1.5;color:var(--fg-2)}
.card input{height:42px;border:0;border-radius:12px;background:var(--hover);padding:0 14px;font-size:14px;outline:none}
.card input:focus{box-shadow:0 0 0 2px var(--accent-soft)}
.card .err{color:var(--danger);font-size:12.5px;min-height:1em}
.card .acts{display:flex;justify-content:flex-end;gap:8px}
.drop-card{align-items:center;text-align:center;padding:40px 28px!important;border:1.5px dashed var(--accent)}
.drop-card svg{width:40px;height:40px;color:var(--accent);stroke-width:1.4}
#toast{position:absolute;z-index:60;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px) scale(.95);opacity:0;
  height:38px;padding:0 18px;font-size:13px;font-weight:500;display:flex;align-items:center;white-space:nowrap;max-width:calc(100% - 32px);
  transition:opacity .25s,transform .5s var(--spring);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loader{position:absolute;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);padding:0 18px 0 14px;gap:10px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none}
#loader.show{opacity:1}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--sep);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#focusExit{position:absolute;z-index:21;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));opacity:0;pointer-events:none;transform:scale(.8);transition:opacity .3s,transform .45s var(--spring)}
#app.focus #focusExit{opacity:1;pointer-events:auto;transform:none}
#fatal{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:70}

@media (max-width:760px){
  #barZoom,.doc-title{display:none}
  .hide-narrow{display:none!important}
  #app.side-open.wide #pages{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
@media (max-width:420px){
  #dock .ib{width:36px}
  .dock-ind{width:36px}
  #barRight .ib{width:36px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app'), viewer = $('#viewer'), pagesEl = $('#pages');
const CSS_UNITS = 96 / 72, GAP = 28;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem('glassreader:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('glassreader:' + k, JSON.stringify(v)); } catch {} }
};
const COLORS = ['#FFD60A', '#34C759', '#5AC8FA', '#FF6FAE', '#FF453A', '#1C1C1E'];
const WIDTHS = [1.2, 2.4, 4.5];

const state = {
  pdf: null, pages: [], zoom: 1, fit: 'auto', rotation: 0, tool: 'select',
  color: store.get('color', COLORS[0]), width: store.get('width', 1), annots: {}, undo: [], redo: [],
  fp: null, current: 1, search: { q: '', matches: [], idx: -1, token: 0 }, loadId: 0
};

/* =================== Sample document (built as real PDF bytes) =================== */
function buildSample() {
  const W = 612, H = 792;
  const esc = s => s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const f = n => +n.toFixed(2);
  const rgb = h => [1, 3, 5].map(i => f(parseInt(h.substr(i, 2), 16) / 255)).join(' ');
  const cw = (s, size, bold) => { let w = 0; for (const ch of s) w += /[il.,:;'!|]/.test(ch) ? .25 : /[fjrtI\-() /]/.test(ch) ? .3 : /[mwMW]/.test(ch) ? .84 : /[A-Z]/.test(ch) ? .68 : /[0-9]/.test(ch) ? .556 : .53; return w * size * (bold ? 1.06 : 1); };
  const pages = [], seeds = [];
  function Page() {
    const ops = [];
    const o = {
      ops,
      rect(x, y, w, h, c) { ops.push(`${rgb(c)} rg ${f(x)} ${f(y)} ${f(w)} ${f(h)} re f`); },
      rr(x, y, w, h, r, c, stroke) {
        const k = .5523 * r;
        const p = `${f(x + r)} ${f(y)} m ${f(x + w - r)} ${f(y)} l ${f(x + w - r + k)} ${f(y)} ${f(x + w)} ${f(y + r - k)} ${f(x + w)} ${f(y + r)} c ${f(x + w)} ${f(y + h - r)} l ${f(x + w)} ${f(y + h - r + k)} ${f(x + w - r + k)} ${f(y + h)} ${f(x + w - r)} ${f(y + h)} c ${f(x + r)} ${f(y + h)} l ${f(x + r - k)} ${f(y + h)} ${f(x)} ${f(y + h - r + k)} ${f(x)} ${f(y + h - r)} c ${f(x)} ${f(y + r)} l ${f(x)} ${f(y + r - k)} ${f(x + r - k)} ${f(y)} ${f(x + r)} ${f(y)} c h`;
        ops.push(stroke ? `${rgb(stroke)} RG 1 w ${p} S` : `${rgb(c)} rg ${p} f`);
      },
      circle(cx, cy, r, c) {
        const k = .5523 * r;
        ops.push(`${rgb(c)} rg ${f(cx + r)} ${f(cy)} m ${f(cx + r)} ${f(cy + k)} ${f(cx + k)} ${f(cy + r)} ${f(cx)} ${f(cy + r)} c ${f(cx - k)} ${f(cy + r)} ${f(cx - r)} ${f(cy + k)} ${f(cx - r)} ${f(cy)} c ${f(cx - r)} ${f(cy - k)} ${f(cx - k)} ${f(cy - r)} ${f(cx)} ${f(cy - r)} c ${f(cx + k)} ${f(cy - r)} ${f(cx + r)} ${f(cy - k)} ${f(cx + r)} ${f(cy)} c f`);
      },
      text(x, y, size, s, { bold = false, color = '#1C1C1E' } = {}) { ops.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${rgb(color)} rg ${f(x)} ${f(y)} Td (${esc(s)}) Tj ET`); },
      wrap(s, size, width, bold) {
        const words = s.split(' '), lines = []; let line = '';
        for (const w of words) { const t = line ? line + ' ' + w : w; if (cw(t, size, bold) > width && line) { lines.push(line); line = w; } else line = t; }
        if (line) lines.push(line); return lines;
      },
      para(x, y, width, s, { size = 12, lead = 18, color = '#3A3F4B', bold = false } = {}) {
        for (const l of o.wrap(s, size, width, bold)) { o.text(x, y, size, l, { color, bold }); y -= lead; }
        return y;
      }
    };
    pages.push(o); return o;
  }
  // Cover
  const c = Page();
  c.rect(0, 0, W, H, '#F4F6FA');
  c.ops.push('q /G1 gs');
  c.circle(440, 610, 210, '#8FB2FF'); c.circle(565, 420, 150, '#FFA9CC'); c.circle(140, 170, 185, '#8FE3C8'); c.circle(250, 740, 120, '#C3B0FF');
  c.ops.push('Q q /G2 gs'); c.rr(60, 236, 492, 316, 30, '#FFFFFF'); c.ops.push('Q');
  c.rr(60, 236, 492, 316, 30, null, '#FFFFFF');
  c.text(96, 502, 10, 'SAMPLE DOCUMENT', { bold: true, color: '#5B606D' });
  c.text(96, 440, 46, 'The Glass', { bold: true });
  c.text(96, 388, 46, 'Handbook', { bold: true });
  c.para(96, 340, 400, 'Everything this reader can do, in six short pages. Scroll, search, highlight and leave notes right here on the page.', { size: 14.5, lead: 21 });
  c.text(96, 268, 10, 'Version 1.0   |   November 2026', { color: '#8B909B' });
  c.text(72, 52, 9, 'Glass Reader sample. Open your own PDF with the folder button in the top bar.', { color: '#8B909B' });

  const chapters = [
    ['Opening documents', [
      ['p', 'Glass Reader opens any PDF on your device. Click the folder button in the top right, or drag a file from your desktop anywhere onto the window.'],
      ['lead', 'Files are read locally and are never uploaded.'],
      ['p', 'Password-protected PDFs work too. When a document is locked, you are asked for its password before the first page appears.'],
      ['b', 'Open: the folder button, or Ctrl/Cmd + O'],
      ['b', 'Drag and drop: release a PDF anywhere on the window'],
      ['b', 'The title in the top bar comes from the document itself when it has one'],
      ['tip', 'Your highlights, drawings and notes are remembered in this browser for each document, so you can close the tab and pick up where you left off.']]],
    ['Moving around', [
      ['p', 'Pages scroll as one continuous column. While you scroll, a page scrubber appears on the right edge. Drag it to travel through long documents quickly.'],

  const starts = []; let acc = 0; for (const s of p.strs) { starts.push(acc); acc += s.length; }
  const per = new Map();
  for (const m of ms) {
    const on = state.search.matches[state.search.idx] === m;
    for (let i = 0; i < p.strs.length; i++) {
      const a = starts[i], b = a + p.strs[i].length; if (b <= m.s) continue; if (a >= m.e) break;
      if (!per.has(i)) per.set(i, []); per.get(i).push([Math.max(m.s, a) - a, Math.min(m.e, b) - a, on]);
    }
  }
  p.hl = [...per.keys()];
  for (const [i, ranges] of per) {
    const div = p.textDivs[i], s = p.strs[i]; if (!div) continue;
    div.textContent = ''; let pos = 0;
    for (const [a, b, on] of ranges) {
      if (a > pos) div.append(s.slice(pos, a));
      const sp = document.createElement('span'); sp.className = 'highlight' + (on ? ' selected' : ''); sp.textContent = s.slice(a, b); div.append(sp); pos = b;
    }
    if (pos < s.length) div.append(s.slice(pos));
  }
}
$('#searchInput').addEventListener('input', e => { clearTimeout(searchT); const v = e.target.value; searchT = setTimeout(() => runSearch(v), 220); });
$('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); if (state.search.q !== e.target.value.trim()) { clearTimeout(searchT); runSearch(e.target.value); } else gotoMatch(state.search.idx + (e.shiftKey ? -1 : 1)); }
  if (e.key === 'Escape') { e.preventDefault(); closeSearch(); viewer.focus({ preventScroll: true }); }
});
$('#searchNext').addEventListener('click', () => gotoMatch(state.search.idx + 1));
$('#searchPrev').addEventListener('click', () => gotoMatch(state.search.idx - 1));
$('#searchClose').addEventListener('click', closeSearch);
$('#btnSearch').addEventListener('click', () => $('#searchPanel').classList.contains('show') ? closeSearch() : openSearch());

/* =================== Tools & dock =================== */
let dockHover = false;
const dock = $('#dock'), dockInd = $('#dockInd');
dock.addEventListener('pointerenter', () => { dockHover = true; dock.classList.remove('compact'); });
dock.addEventListener('pointerleave', () => { dockHover = false; });
function moveInd() { const b = dock.querySelector('.tool.on'); if (!b) return; dockInd.style.transform = `translateX(${b.offsetLeft}px)`; dockInd.style.width = b.offsetWidth + 'px'; }
new ResizeObserver(moveInd).observe(dock);
function setTool(t) {
  state.tool = t;
  app.className = app.className.replace(/\bt-\w+/g, '').trim() + ' t-' + t;
  $$('#dock .tool').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  moveInd(); closePops(); if (state.notePopFor) closeNote();
  if (t !== 'select' && t !== 'highlight') getSelection().removeAllRanges();
}
$$('#dock .tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
function setColor(c) {
  state.color = c; store.set('color', c);
  app.style.setProperty('--tool-color', c);
  renderColorPop();
}
function renderColorPop() {
  const pop = $('#colorPop');
  buildSwatches(pop, c => { setColor(c); }, state.color);
  const sep = document.createElement('span'); sep.className = 'sep'; pop.append(sep);
  WIDTHS.forEach((w, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'wd' + (i === state.width ? ' on' : '');
    b.setAttribute('aria-label', ['Thin', 'Medium', 'Thick'][i] + ' stroke'); const s = 4 + i * 4;
    b.innerHTML = `<i style="width:${s}px;height:${s}px"></i>`;
    b.addEventListener('click', () => { state.width = i; store.set('width', i); renderColorPop(); });
    pop.append(b);
  });
}
$('#btnColor').addEventListener('click', () => {
  const pop = $('#colorPop'); if (pop.classList.contains('show')) { pop.classList.remove('show'); return; }
  closePops(pop);
  const r = $('#btnColor').getBoundingClientRect(), ar = app.getBoundingClientRect();
  pop.style.visibility = 'hidden'; pop.classList.add('show'); const w = pop.offsetWidth; pop.classList.remove('show'); pop.style.visibility = '';
  pop.style.left = Math.max(12, Math.min(ar.width - w - 12, r.left + r.width / 2 - w / 2 - ar.left)) + 'px';
  pop.style.top = (r.top - ar.top - 62) + 'px';
  requestAnimationFrame(() => pop.classList.add('show'));
});
$('#btnUndo').addEventListener('click', undo);
$('#btnRedo').addEventListener('click', redo);

/* Pan tool */
let pan = null;
viewer.addEventListener('pointerdown', e => {
  if (state.tool !== 'hand' || e.button !== 0 || e.pointerType === 'touch' || e.target.closest('.note-pin')) return;
  cancelAnimationFrame(anim);
  pan = { x: e.clientX, y: e.clientY, sl: viewer.scrollLeft, st: viewer.scrollTop }; viewer.setPointerCapture(e.pointerId); app.classList.add('panning'); e.preventDefault();
});
viewer.addEventListener('pointermove', e => { if (!pan) return; viewer.scrollLeft = pan.sl - (e.clientX - pan.x); viewer.scrollTop = pan.st - (e.clientY - pan.y); });
const endPan = () => { pan = null; app.classList.remove('panning'); };
viewer.addEventListener('pointerup', endPan); viewer.addEventListener('pointercancel', endPan);

/* =================== Top bar & view menu =================== */
function toggleSidebar(force) {
  const on = force ?? !app.classList.contains('side-open');
  const a = getAnchor();
  app.classList.toggle('side-open', on); $('#btnSidebar').classList.toggle('on', on); $('#btnSidebar').setAttribute('aria-pressed', on);
  store.set('sidebar', on);
  if (isWide()) {
    if (state.fit) { setTimeout(() => setZoom(fitZoom(state.fit), null, state.fit), 0); }
    const t0 = performance.now(); const keep = () => { for (const p of state.pages) { p.top = p.el.offsetTop; } if (a && !state.fit) restoreAnchor(a); if (performance.now() - t0 < 480) requestAnimationFrame(keep); };
    requestAnimationFrame(keep);
  }
}
$('#btnSidebar').addEventListener('click', () => toggleSidebar());
$('#sideSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const t = +b.dataset.tab;
  $('#sideSeg').dataset.on = t; $$('#sideSeg button').forEach(x => x.classList.toggle('on', x === b));
  $('#thumbs').hidden = t !== 0; $('#outline').hidden = t !== 1;
});
$('#btnZoomIn').addEventListener('click', () => zoomStep(1));
$('#btnZoomOut').addEventListener('click', () => zoomStep(-1));
$('#mZoomIn').addEventListener('click', () => zoomStep(1));
$('#mZoomOut').addEventListener('click', () => zoomStep(-1));
$('#zoomLabel').addEventListener('click', () => state.fit === 'width' ? applyFit('actual') : applyFit('width'));
$('#fitChoice').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyFit(b.dataset.fit); });
$('#btnView').addEventListener('click', () => { const m = $('#viewMenu'); const on = !m.classList.contains('show'); closePops(m); m.classList.toggle('show', on); $('#btnView').classList.toggle('on', on); });
const chooseFile = () => window.desktop ? window.desktop.openDialog() : $('#fileInput').click();
$('#btnOpen').addEventListener('click', chooseFile);
$('#fileInput').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
$('#mSample').addEventListener('click', () => { closePops(); openSample(); });
function fullscreen() {
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  const el = document.documentElement;
  if (!el.requestFullscreen) { toast('Full screen isn’t available here. Try focus mode (F).'); return; }
  el.requestFullscreen().catch(() => toast('Full screen isn’t available here. Try focus mode (F).'));
}
$('#btnFull').addEventListener('click', fullscreen);
function focusMode(on) { on = on ?? !app.classList.contains('focus'); app.classList.toggle('focus', on); closePops(); if (on) toast('Focus mode. Press Esc or F to show controls.'); }
$('#mFocus').addEventListener('click', () => focusMode(true));
$('#focusExit').addEventListener('click', () => focusMode(false));
function rotate(d) {
  const a = getAnchor();
  state.rotation = (state.rotation + d + 360) % 360;
  state.pages.forEach(p => { if (p.canvas) p.canvas.style.opacity = 0; });
  sizeThumbs(); state.pages.forEach(p => p.thumbKey = null);
  if (state.fit) state.zoom = fitZoom(state.fit);
  layout(a); scheduleRender(0);
  $$('.thumb').forEach((t, i) => { if (t.getBoundingClientRect().height) thumbQ.add(state.pages[i]); }); thumbPump();
}
$('#mRotL').addEventListener('click', () => rotate(-90));
$('#mRotR').addEventListener('click', () => rotate(90));
const tintChoice = $('#tintChoice');
function setTint(t) { pagesEl.classList.remove('tint-sepia', 'tint-night'); if (t !== 'white') pagesEl.classList.add('tint-' + t); $$('button', tintChoice).forEach(b => b.classList.toggle('on', b.dataset.tint === t)); store.set('tint', t); }
tintChoice.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTint(b.dataset.tint); });
const hostTheme = document.documentElement.getAttribute('data-theme');
function setTheme(t) {
  const root = document.documentElement;
  if (t === 'auto') { hostTheme ? root.setAttribute('data-theme', hostTheme) : root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme', t);
  $$('#themeChoice button').forEach(b => b.classList.toggle('on', b.dataset.themeSet === t)); store.set('theme', t);
  if (window.desktop) window.desktop.setTheme(t);
}
$('#themeChoice').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.themeSet); });
const pageInput = $('#pageInput');
pageInput.addEventListener('keydown', e => { if (e.key === 'Enter') { const n = parseInt(pageInput.value, 10); if (n) goToPage(n); pageInput.blur(); } if (e.key === 'Escape') { pageInput.value = state.current; pageInput.blur(); } });
pageInput.addEventListener('focus', () => pageInput.select());
pageInput.addEventListener('blur', () => { pageInput.value = state.current; });

/* Drag & drop */
let dragDepth = 0;
addEventListener('dragenter', e => { if (![...(e.dataTransfer?.types || [])].includes('Files')) return; e.preventDefault(); dragDepth++; $('#dropZone').classList.add('show'); });
addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#dropZone').classList.remove('show'); } });
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#dropZone').classList.remove('show'); const f = e.dataTransfer?.files?.[0]; if (f) openFile(f); });

/* Keyboard */
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, k = e.key, typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (mod && k.toLowerCase() === 'f') { e.preventDefault(); openSearch(); return; }
  if (k === 'Escape') {
    if (state.notePopFor) { closeNote(); return; }
    if (app.classList.contains('focus')) { focusMode(false); return; }
    if (pops.some(p => p.classList.contains('show'))) { if ($('#searchPanel').classList.contains('show')) closeSearch(); closePops(); return; }
    if (state.tool !== 'select') setTool('select');
    return;
  }
  if (typing) return;
  if (mod && (k === '=' || k === '+')) { e.preventDefault(); zoomStep(1); return; }
  if (mod && k === '-') { e.preventDefault(); zoomStep(-1); return; }
  if (mod && k === '0') { e.preventDefault(); applyFit('width'); return; }
  if (mod && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k.toLowerCase() === 'o') { e.preventDefault(); chooseFile(); return; }
  if (mod || e.altKey) return;
  const map = { v: 'select', h: 'hand', m: 'highlight', p: 'pen', n: 'note', e: 'eraser' };
  const lk = k.toLowerCase();
  if (map[lk]) { setTool(map[lk]); return; }
  if (lk === 's') { toggleSidebar(); return; }
  if (lk === 'f') { focusMode(); return; }
  if (lk === 'r') { rotate(e.shiftKey ? -90 : 90); return; }
  const noH = viewer.scrollWidth <= viewer.clientWidth + 2;
  if ((k === 'ArrowRight' && noH) || k === 'PageDown') { e.preventDefault(); goToPage(state.current + 1); }
  else if ((k === 'ArrowLeft' && noH) || k === 'PageUp') { e.preventDefault(); goToPage(state.current - 1); }
  else if (k === 'Home') { e.preventDefault(); goToPage(1); }
  else if (k === 'End') { e.preventDefault(); goToPage(state.pages.length); }
});

/* =================== Boot =================== */
if (window.desktop) {
  const root = document.documentElement;
  root.classList.add('desktop');
  if (window.desktop.mica) root.classList.add('mica');
  // Use the Windows accent color for buttons, selection and the active tool.
  const applyAccent = c => {
    if (!c || !/^[0-9a-f]{6}/i.test(c)) return;
    const hex = '#' + c.slice(0, 6), n = parseInt(c.slice(0, 6), 16);
    root.style.setProperty('--accent', hex);
    root.style.setProperty('--accent-soft', `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},.2)`);
  };
  window.desktop.accent().then(applyAccent, () => {});
  window.desktop.onAccent(applyAccent);
}
app.classList.toggle('wide', isWide());
if (!store.get('sidebar', isWide()) || !isWide()) { app.classList.remove('side-open'); $('#btnSidebar').classList.remove('on'); $('#btnSidebar').setAttribute('aria-pressed', 'false'); }
setColor(state.color); setTint(store.get('tint', 'white')); setTheme(store.get('theme', 'auto'));
setTool('select');
if (!window.pdfjsLib) {
  const f = document.createElement('div'); f.id = 'fatal';
  f.innerHTML = '<div class="glass panel card"><h2>The PDF engine didn’t load</h2><p>Check your internet connection and reload the page.</p></div>';
  app.append(f); return;
}
pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
if (window.desktop) {
  const d = window.desktop;
  d.onOpenFile(f => openPdf(new Uint8Array(f.data), f.name));
  d.onUpdateReady(v => { $('#updateText').textContent = `Glass Reader ${v} is ready.`; $('#updateBar').classList.add('show'); });
  $('#updateBtn').addEventListener('click', () => d.restartToUpdate());
  $('#updateLater').addEventListener('click', () => $('#updateBar').classList.remove('show'));
  d.initialFile().then(f => f ? openPdf(new Uint8Array(f.data), f.name) : openSample(), openSample);
} else openSample();
})();
</script>
