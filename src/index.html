<div id="app" class="t-select side-open">
  <div class="ambient"></div>
  <div id="tabstrip"><div id="tabs" role="tablist" aria-label="Open documents"></div><button class="tab-new" id="tabNew" title="New tab (Ctrl T)" aria-label="New tab"><svg class="i"><use href="#i-plus"/></svg></button></div>

  <section id="home" hidden>
    <nav class="hnav glass panel" aria-label="Home menu" data-lg-strength="20">
      <div class="hbrand"><img src="icon.png" alt=""><b>Glass Reader</b></div>
      <button class="hitem on" data-view="home"><svg class="i"><use href="#i-home"/></svg>Home</button>
      <button class="hitem" data-view="recent"><svg class="i"><use href="#i-clock"/></svg>Recent</button>
      <span class="hdiv"></span>
      <button class="hitem" data-act="open"><svg class="i"><use href="#i-folder"/></svg>Open file…</button>
      <button class="hitem" data-act="sample"><svg class="i"><use href="#i-doc"/></svg>Sample guide</button>
      <span class="hgrow"></span>
      <button class="hitem" data-act="settings"><svg class="i"><use href="#i-gear"/></svg>Settings</button>
    </nav>
    <div class="hmain"></div>
  </section>
  <main id="viewer" tabindex="-1" aria-label="Document"><div id="pages"></div></main>

  <header id="topbar">
    <div class="glass bar" id="barLeft">
      <button class="ib on" id="btnSidebar" title="Sidebar (S)" aria-label="Toggle sidebar" aria-pressed="true"><svg class="i"><use href="#i-sidebar"/></svg></button>
      <div class="doc-title" id="docTitle">Opening…</div>
      <label class="chip" for="pageInput" title="Go to page"><input id="pageInput" inputmode="numeric" autocomplete="off" value="1" aria-label="Page number"><span>of <span id="pageTotal">–</span></span></label>
    </div>
    <div class="glass bar" id="barZoom">
      <button class="ib" id="btnZoomOut" title="Zoom out (Ctrl −)" aria-label="Zoom out"><svg class="i"><use href="#i-minus"/></svg></button>
      <button class="txtbtn" id="zoomLabel" title="Toggle fit width / 100%">100%</button>
      <button class="ib" id="btnZoomIn" title="Zoom in (Ctrl +)" aria-label="Zoom in"><svg class="i"><use href="#i-plus"/></svg></button>
    </div>
    <div class="glass bar" id="barRight">
      <button class="ib" id="btnSearch" title="Search (Ctrl F)" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
      <button class="ib" id="btnTools" title="PDF tools (T)" aria-label="PDF tools"><svg class="i"><use href="#i-grid"/></svg></button>
      <button class="ib hide-narrow" id="btnSave" title="Save a copy with your markup (Ctrl S)" aria-label="Save a copy"><svg class="i"><use href="#i-save"/></svg></button>
      <button class="ib" id="btnView" title="View options" aria-label="View options"><svg class="i"><use href="#i-sliders"/></svg></button>
      <button class="ib" id="btnOpen" title="Open PDF (Ctrl O)" aria-label="Open PDF"><svg class="i"><use href="#i-folder"/></svg></button>
      <button class="ib" id="btnSettings" title="Settings (Ctrl ,)" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <aside id="sidebar" class="glass panel" aria-label="Pages and outline" data-lg-strength="22">
    <div class="seg" id="sideSeg" data-on="0"><span class="seg-ind"></span><button class="on" data-tab="0">Pages</button><button data-tab="1">Outline</button></div>
    <div class="side-scroll" id="thumbs"></div>
    <div class="side-scroll" id="outline" hidden></div>
  </aside>

  <div id="searchPanel" class="glass bar pop" role="search">
    <svg class="i"><use href="#i-search"/></svg>
    <input id="searchInput" placeholder="Search in document" autocomplete="off" spellcheck="false" aria-label="Search text">
    <span id="searchCount"></span>
    <button class="ib" id="searchPrev" title="Previous (Shift Return)" aria-label="Previous match"><svg class="i"><use href="#i-up"/></svg></button>
    <button class="ib" id="searchNext" title="Next (Return)" aria-label="Next match"><svg class="i"><use href="#i-down"/></svg></button>
    <button class="ib" id="searchClose" title="Close (Esc)" aria-label="Close search"><svg class="i"><use href="#i-x"/></svg></button>
  </div>

  <div id="viewMenu" class="glass panel pop" role="dialog" aria-label="View options">
    <div class="mrow"><div class="mlabel">Zoom</div>
      <div class="mline"><button class="ib" id="mZoomOut" aria-label="Zoom out"><svg class="i"><use href="#i-minus"/></svg></button><div class="zoomval" id="mZoomVal">100%</div><button class="ib" id="mZoomIn" aria-label="Zoom in"><svg class="i"><use href="#i-plus"/></svg></button></div>
      <div class="choice" id="fitChoice"><button data-fit="width">Fit width</button><button data-fit="page">Fit page</button><button data-fit="actual">Actual</button></div>
    </div>
    <div class="mrow"><div class="mlabel">Page color</div>
      <div class="choice" id="tintChoice"><button data-tint="white">White</button><button data-tint="sepia">Sepia</button><button data-tint="night">Night</button></div>
    </div>
    <div class="mrow"><div class="mlabel">Appearance</div>
      <div class="choice" id="themeChoice"><button data-theme-set="auto">Auto</button><button data-theme-set="light">Light</button><button data-theme-set="dark">Dark</button></div>
    </div>
    <div class="mrow"><div class="mlabel">Pages</div>
      <div class="mline"><button class="pill-btn" id="mRotL"><svg class="i"><use href="#i-rotl"/></svg>Rotate left</button><button class="pill-btn" id="mRotR"><svg class="i"><use href="#i-rotr"/></svg>Rotate right</button></div>
      <div class="mline"><button class="pill-btn" id="mFocus"><svg class="i"><use href="#i-focus"/></svg>Focus mode</button><button class="pill-btn" id="btnFull"><svg class="i"><use href="#i-expand"/></svg>Full screen</button></div>
      <div class="mline"><button class="pill-btn" id="mSample"><svg class="i"><use href="#i-doc"/></svg>Open the sample guide</button></div>
    </div>
    <div id="appVersion" class="vfoot" hidden></div>
  </div>

  <nav id="dock" class="glass bar" aria-label="Tools" data-lg-strength="24">
    <span class="dock-ind" id="dockInd"></span>
    <button class="ib tool on" data-tool="select" title="Select text (V)" aria-label="Select text"><svg class="i"><use href="#i-cursor"/></svg></button>
    <button class="ib tool hide-narrow" data-tool="hand" title="Pan (H)" aria-label="Pan"><svg class="i"><use href="#i-hand"/></svg></button>
    <button class="ib tool" data-tool="highlight" title="Highlighter (M)" aria-label="Highlighter"><svg class="i"><use href="#i-marker"/></svg></button>
    <button class="ib tool" data-tool="pen" title="Pen (P)" aria-label="Pen"><svg class="i"><use href="#i-pen"/></svg></button>
    <button class="ib tool" data-tool="text" title="Add text (X)" aria-label="Add text"><svg class="i"><use href="#i-text"/></svg></button>
    <button class="ib tool" data-tool="note" title="Note (N)" aria-label="Note"><svg class="i"><use href="#i-note"/></svg></button>
    <button class="ib tool" data-tool="eraser" title="Eraser (E)" aria-label="Eraser"><svg class="i"><use href="#i-eraser"/></svg></button>
    <span class="sep hc"></span>
    <button class="ib hc" id="btnColor" title="Color and stroke" aria-label="Color and stroke"><span class="swatch"></span></button>
    <span class="sep hc"></span>
    <button class="ib hc" id="btnUndo" title="Undo (Ctrl Z)" aria-label="Undo" disabled><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="ib hc hide-narrow" id="btnRedo" title="Redo (Shift Ctrl Z)" aria-label="Redo" disabled><svg class="i"><use href="#i-redo"/></svg></button>
  </nav>

  <div id="colorPop" class="glass bar pop up" aria-label="Color"></div>
  <div id="selPop" class="glass bar pop up" aria-label="Selection"></div>
  <div id="notePop" class="glass panel pop" role="dialog" aria-label="Note">
    <textarea id="noteText" placeholder="Write a note…" aria-label="Note text"></textarea>
    <div class="nrow"><span class="meta" id="noteMeta"></span><span style="display:flex;gap:4px"><button class="ib" id="noteDel" title="Delete" aria-label="Delete" style="color:var(--danger)"><svg class="i"><use href="#i-trash"/></svg></button><button class="txtbtn primary" id="noteDone">Done</button></span></div>
  </div>

  <div id="scrubber" aria-hidden="true"><div id="scrubThumb"></div><div id="scrubBubble" class="glass" data-lg-strength="18">1<span>of 1</span></div></div>

  <button id="focusExit" class="glass ib" style="width:44px;height:44px" title="Show controls (Esc)" aria-label="Show controls"><svg class="i"><use href="#i-focus"/></svg></button>
  <div id="loader" class="glass bar"><span class="spin"></span><span id="loaderText">Opening…</span></div>
  <div id="toast" class="glass"></div>
  <div id="updateBar" class="glass bar" role="status"><svg class="i" style="margin-left:6px;color:var(--accent)"><use href="#i-update"/></svg><span id="updateText">An update is ready.</span><button class="txtbtn primary" id="updateBtn" style="height:32px">Restart now</button><button class="ib" id="updateLater" style="width:32px;height:32px" aria-label="Later"><svg class="i"><use href="#i-x"/></svg></button></div>

  <div id="toolsSheet" class="sheet-scrim" aria-hidden="true"><section class="glass panel sheet" role="dialog" aria-label="PDF tools" id="toolsPanel" data-lg-strength="22"></section></div>
  <div id="settingsSheet" class="sheet-scrim" aria-hidden="true"><section class="glass panel sheet narrow" role="dialog" aria-label="Settings" id="settingsPanel" data-lg-strength="22"></section></div>

  <div id="dropZone" class="scrim"><div class="glass panel card drop-card"><svg class="i"><use href="#i-doc"/></svg><h2>Drop to open</h2><p>The file stays on your device.</p></div></div>
  <div id="pwDialog" class="scrim"><form class="glass panel card" id="pwForm">
    <h2>This document is locked</h2><p id="pwName">Enter the password to open it.</p>
    <input type="password" id="pwInput" autocomplete="off" placeholder="Password" aria-label="Document password">
    <div class="err" id="pwErr"></div>
    <div class="acts"><button type="button" class="txtbtn" id="pwCancel">Cancel</button><button type="submit" class="txtbtn primary">Open</button></div>
  </form></div>
  <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
</div>
